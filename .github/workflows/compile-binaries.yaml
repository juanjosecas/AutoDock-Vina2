name: Compile AutoDock-Vina binaries

on:
  push:
    branches:
      - master
      - develop
    paths-ignore:
      - 'example/**'
      - 'docs/**'
      - 'data/**'
  pull_request:
    branches:
      - master
      - develop
    paths-ignore:
      - 'example/**'
      - 'docs/**'
      - 'data/**'
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  compile_binaries:
    name: Compile binaries on ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: windows-2022
            arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libboost-system-dev \
            libboost-thread-dev \
            libboost-serialization-dev \
            libboost-filesystem-dev \
            libboost-program-options-dev

      - name: Compile Linux binaries
        if: runner.os == 'Linux'
        run: |
          make -C build/linux/release -j"$(nproc)"

      - name: Cache Boost for Windows
        if: runner.os == 'Windows'
        id: boost-cache
        uses: actions/cache@v4
        with:
          path: C:\local\boost_1_83_0
          key: boost-1.83.0-windows-2022-msvc-14.3-x64-v1

      - name: Install Boost for Windows
        if: runner.os == 'Windows' && steps.boost-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://sourceforge.net/projects/boost/files/boost-binaries/1.83.0/boost_1_83_0-msvc-14.3-64.exe/download"
          $installer = Join-Path $env:RUNNER_TEMP "boost.exe"

          Invoke-WebRequest -Uri $url -OutFile $installer

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList @(
              "/VERYSILENT",
              "/SP-",
              "/SUPPRESSMSGBOXES",
              "/NORESTART",
              "/DIR=C:\local\boost_1_83_0"
            ) `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
            throw "Boost installer failed with exit code $($process.ExitCode)"
          }

          $boostLib = "C:\local\boost_1_83_0\lib64-msvc-14.3"
          if (-not (Test-Path $boostLib)) {
            throw "Boost libraries were not installed at $boostLib"
          }

      - name: Compile Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $boostLib = "C:\local\boost_1_83_0\lib64-msvc-14.3"
          if (-not (Test-Path $boostLib)) {
            throw "Boost libraries not found at $boostLib"
          }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere `
            -latest `
            -products '*' `
            -requires Microsoft.Component.MSBuild `
            -find 'MSBuild\**\Bin\MSBuild.exe' |
            Select-Object -First 1

          if (-not $msbuild) {
            throw "MSBuild was not found"
          }

          $gitVersion = git describe --tags --abbrev=7 --dirty --always
          if ($LASTEXITCODE -ne 0 -or -not $gitVersion) {
            throw "Could not determine the Git version"
          }

          Write-Host "Version: $gitVersion"
          Write-Host "MSBuild: $msbuild"
          Write-Host "Boost: $boostLib"

          Set-Location build/windows

          & .\compile.bat Release x64 $boostLib $msbuild $gitVersion

          if ($LASTEXITCODE -ne 0) {
            throw "Compilation failed with exit code $LASTEXITCODE"
          }

      - name: Upload Linux binaries
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: binaries-linux-x86_64
          if-no-files-found: error
          path: |
            build/linux/release/vina
            build/linux/release/vina_split

      - name: Upload Windows binaries
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: binaries-windows-x64
          if-no-files-found: error
          path: |
            build/windows/release/vina.exe
            build/windows/release/vina_split.exe
